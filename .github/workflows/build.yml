name: Build Velra

on:
  push:
    tags: ['v*']
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :velra:testDebugUnitTest

      - name: Compile library
        run: ./gradlew :velra:compileDebugKotlin

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release AAR
        run: ./gradlew :velra:assembleRelease

      - name: Verify AAR contains libvelra.so
        run: |
          AAR="velra/build/outputs/aar/velra-release.aar"
          unzip -l "$AAR" | grep "libvelra.so"
          echo "AAR contains libvelra.so: OK"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velra-${{ github.ref_name }}
          path: velra/build/outputs/aar/velra-release.aar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: velra/build/outputs/aar/velra-release.aar
          generate_release_notes: true
          name: Velra ${{ github.ref_name }}